services:
  relay:
    # placeholder until relay image published
    image: ghcr.io/crocs-muni/scrutiny-relay-demo:latest
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  explorer:
    build: .
    ports:
      - "5173:3000"
    environment:
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL:-https://llm.ai.e-infra.cz/v1}
      - MODEL=${MODEL:-coder}
      - PUBLIC_RELAY_URLS=${PUBLIC_RELAY_URLS:-ws://localhost:8080/ws}
    depends_on:
      relay:
        condition: service_started
