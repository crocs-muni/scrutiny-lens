name: pages

# Deploys the static SPA to THIS repo's GitHub Pages (issue #16; deploy doc:
# docs/deploy.md) — https://lens.scrutiny.cloud (custom domain), which also
# keeps answering at https://crocs-muni.github.io/scrutiny-lens.
# Custom domain → site serves from /, so no BASE_PATH is baked into the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy mid-flight; queue instead.
  group: pages
  cancel-in-progress: false

jobs:
  gate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lens
        uses: actions/checkout@v4
        with:
          path: lens

      - name: Prepare (pinned siblings, pnpm, core build, install)
        uses: ./lens/.github/actions/prepare

      - name: Typecheck
        working-directory: lens
        run: pnpm check

      - name: Test
        working-directory: lens
        run: pnpm test

      - name: Build static site
        # Deploy pool for the BUILT artifact: our production scrutiny relay
        # leads, so a fresh visitor lands on scrutiny data; public relays
        # follow as fallback. Step-scoped on purpose: at job level it leaked
        # into `pnpm test`, where DEFAULT_RELAYS must equal the in-source
        # spec pool (tests/config.test.ts assumes no env) — broken main
        # deploys since #152.
        env:
          PUBLIC_RELAY_URLS: wss://relay.scrutiny.cloud,wss://relay.damus.io,wss://nos.lol
        working-directory: lens
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lens/build

  deploy:
    needs: gate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
