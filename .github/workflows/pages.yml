name: pages

# Deploys the static SPA to THIS repo's GitHub Pages (issue #16; deploy doc:
# docs/deploy.md) — https://crocs-muni.github.io/scrutiny-lens.
# Project site → BASE_PATH=/scrutiny-lens baked into the build.
# Uses GITHUB_TOKEN only: no secrets, no external repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy mid-flight; queue instead.
  group: pages
  cancel-in-progress: false

jobs:
  gate-and-build:
    runs-on: ubuntu-latest
    env:
      # HTTPS host → wss relays only. Pool per docs/deploy.md: the seeded
      # demo corpus relay FIRST (a fresh visitor must land on data), the
      # public pair after it (3 ≤ the 1–4 spec window).
      PUBLIC_RELAY_URLS: wss://lens-demo.feeds.relay.tools,wss://relay.damus.io,wss://nos.lol
      BASE_PATH: /scrutiny-lens
    steps:
      - name: Check out lens
        uses: actions/checkout@v4
        with:
          path: lens

      - name: Prepare (pinned siblings, pnpm, core build, install)
        uses: ./lens/.github/actions/prepare

      - name: Typecheck
        working-directory: lens
        run: pnpm check

      - name: Test
        working-directory: lens
        run: pnpm test

      - name: Build static site
        working-directory: lens
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lens/build

  deploy:
    needs: gate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
